auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Chunks and index live in the shared telemetry bucket under loki/. The bucket and region come from the environment
# (Loki runs with -config.expand-env=true); the credentials are the instance role's. The tsdb index in use and the
# compactor's scratch space stay on the local volume.
storage_config:
  object_prefix: loki/
  aws:
    bucketnames: ${TELEMETRY_BUCKET}
    region: ${AWS_REGION}

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true   # required by the OTLP endpoint (trace_id, span_id, ...)
  retention_period: 168h            # 7 days

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3
