stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

compactor:
  compaction:
    block_retention: 168h   # 7 days

storage:
  trace:
    backend: s3
    wal:
      path: /var/tempo/wal   # stays local: it holds the traces not yet flushed as blocks
    # Blocks go to the shared telemetry bucket under tempo/. The bucket and region come from the environment (Tempo
    # runs with -config.expand-env=true); the credentials are the instance role's.
    s3:
      bucket: ${TELEMETRY_BUCKET}
      prefix: tempo
      endpoint: s3.${AWS_REGION}.amazonaws.com
      region: ${AWS_REGION}
